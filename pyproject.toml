[project]
name = "hr-copilot-backend"
version = "1.0.0"
description = "Zero-Cost AI HR Automation & Talent Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pypdf>=5.1.0",
    "trafilatura>=2.0.0",
    "litellm>=1.56.5",
    "google-genai>=0.3.0",
    "openai>=1.58.1",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
