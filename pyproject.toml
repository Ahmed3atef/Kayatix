[project]
name = "hr-copilot-backend"
version = "2.0.0"
description = "Zero-Cost AI HR Automation & Talent Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "pypdf>=5.1.0",
    "trafilatura>=1.12.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
